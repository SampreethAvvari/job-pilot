name: deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

# NOTE FOR FORKS: this workflow deploys to the original author's GCP project and
# will fail harmlessly on forks (the WIF provider only trusts this exact repo).
# Replace the project/WIF/service-account values with your own — see docs/FORK-SETUP.md.
jobs:
  changes:
    if: github.repository == 'SampreethAvvari/job-pilot'
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline:
              - 'src/**'
              - 'profile.yaml'
              - 'Dockerfile'
              - 'pyproject.toml'
            ui:
              - 'ui/**'

  deploy-pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/132057439014/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: jobpilot-deployer@jobpilot-sva.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run jobs deploy jobpilot \
            --source . \
            --project jobpilot-sva \
            --region us-central1 \
            --service-account jobpilot-runner@jobpilot-sva.iam.gserviceaccount.com \
            --task-timeout 45m \
            --max-retries 0 \
            --quiet

  deploy-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/132057439014/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: jobpilot-deployer@jobpilot-sva.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          cd ui && gcloud run deploy jobpilot-ui \
            --source . \
            --project jobpilot-sva \
            --region us-central1 \
            --service-account jobpilot-ui@jobpilot-sva.iam.gserviceaccount.com \
            --quiet
