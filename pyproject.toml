[project]
name = "jobpilot"
version = "0.1.0"
description = "Daily multi-source job search, scoring, dashboard, and digest pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-genai>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-httpx>=0.30", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobpilot = ["prompts/*.txt", "resumes/*.tex"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
